name: lab12

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # En Apple Silicon se ejecuta con emulación (Rosetta), no soportado oficialmente.
    container_name: lab12-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: lab12-cloudbeaver
    environment:
      CB_SERVER_NAME: "Lab12 CloudBeaver"
      CB_SERVER_URL: "http://localhost:8978"
      CB_ADMIN_NAME: ${CB_ADMIN_NAME:-cbadmin}
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD:?Define CB_ADMIN_PASSWORD en .env}
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  cloudbeaver_data:
